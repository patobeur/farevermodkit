 .item-icon{display:block;width:64px;height:64px;margin:-2px 0 8px;border-radius:8px;background-repeat:no-repeat;border:1px solid #a88b7e;box-shadow:0 2px 5px #6b514833}main{background:rgba(255,255,255,0.85);border-radius:12px;margin-bottom:20px;box-shadow:0 10px 40px #0004}</style><link rel="stylesheet" href="css/theme-farever.css"><script src="js/navigation.js" defer></script></head><body class="report-page"><div data-farever-navigation></div><header><div class="toolbar"><select id="hero" hidden></select><input id="search" type="search" placeholder="Rechercher / Search..." hidden><input id="dataFile" type="file" accept=".js" hidden><div id="characters" class="character-tags" aria-label="Personnages"></div></div></header><main><div id="notice" class="card notice">Chargement automatique / Auto-loading of <b>farever-report-data.js</b>...</div><div id="stats" class="stats"></div><nav id="tabs" class="tabs"></nav><section id="view"></section></main><footer id="report-footer" class="report-footer"><span id="footer-read">Dernière lecture : ?</span></footer><script src="../farever-report-data.js" charset="utf-8"></script><script>

let D=null,tab=t('Inv'),jobTab='';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),list=x=>Array.isArray(x)?x:[];
let atlas=new Map(),recipes=new Map(),inv=new Map(),jobs=new Map(),sharedBank=[],sharedBankEquipment=[];const keyOf=x=>x.characterUuid||x.steamAccountId||x.character;
function loadData(source){let box={};try{if(source&&typeof source==='object')D=source;else{new Function('window',source)(box);D=box.FAREVER_REPORT_DATA}if(!D)throw 0}catch(e){$('#notice').className='card notice error';$('#notice').textContent='Impossible de charger les donn\u00e9es Farever. Cliquez sur le bouton de secours pour choisir farever-report-data.js.';return}const rows=(D.atlasTsv||'').trim().split(/\r?\n/).map(x=>x.split('\t')),heads=(rows.shift()||[]).map(x=>x.replace(/^#\s*/,''));atlas=new Map();recipes=new Map();for(let r of rows){if(!r[0])continue;let o={};heads.forEach((h,i)=>o[h]=r[i]||'');if(o.category==='recipes'){let item=atlas.get(o.id)||{};o.desc=o.desc||item.desc;o.icon=o.icon||item.icon;o.tags=[...new Set([...(item.tags||'').split(','),...(o.tags||'').split(',')].filter(Boolean))].join(',');recipes.set(o.id,o)}else atlas.set(o.id,o)}inv=new Map(list(D.inventories).map(x=>[keyOf(x),x]));jobs=new Map(list(D.jobs).map(x=>[keyOf(x),x]));let names=[...new Set([...inv.keys(),...jobs.keys()])].sort();$('#hero').innerHTML=names.map(n=>'<option value="'+esc(n)+'">'+esc((inv.get(n)||jobs.get(n)||{}).character||n)+'</option>').join('');let accounts=new Map();names.forEach(n=>{let ci=inv.get(n)||jobs.get(n)||{},account=ci.steamAccountId||'compte-inconnu';if(!accounts.has(account))accounts.set(account,[]);accounts.get(account).push(n)});$('#characters').innerHTML=[...accounts].map(([account,characters])=>'<section class="account-group"><h3>Compte '+esc(account)+'</h3><div>'+characters.map(n=>{let ci=inv.get(n)||jobs.get(n)||{},cc=ci.heroClass||ci.hero_class||''+t('UnknownClass')+'';return '<button type="button" class="character-tag" data-character="'+esc(n)+'" data-class="'+esc(cc)+'"><b>'+esc(ci.character||n)+'</b><span>'+esc(cc)+' &mdash; niveau '+esc(ci.level||'?')+'</span></button>'}).join('')+'</div></section>').join('');$('#characters').querySelectorAll('[data-character]').forEach(b=>b.onclick=()=>{$('#hero').value=b.dataset.character;jobTab='';rende $('#dataFile').onchange=async e=>{let f=e.target.files[0];if(f)loadData(await f.text())};
const title=id=>atlas.get(id)?.name||id||'Inconnu';
function recipeInfo(a){
 let parts=String(a.acquire||'').split('|').map(x=>x.trim()),needs=parts.find(x=>x.startsWith('Needs:')),cost=parts.find(x=>x.startsWith('Cost:')),find=parts.some(x=>x.includes('Unlocked by a recipe you must find')||x.startsWith('Unlocked by:')),auto=!find&&parts.some(x=>x.includes('Known automatically')),sold=parts.some(x=>x.includes('Sold by a merchant')),items=needs?needs.slice(6).split(',').map(x=>x.trim()).filter(Boolean):[];
 let tags=String(a.tags||'').split(',').map(x=>x.trim()).filter(Boolean),tag=(key)=>tags.filter(x=>x.startsWith(key+':')).map(x=>x.slice(key.length+1)),rarities=[t('Rarity0'),t('Rarity1'),t('Rarity2'),t('Rarity3'),t('Rarity4')],r=Math.max(0,Math.min(4,Number(a.rarity)||0));
 let facts='<div class="facts"><span class="badge rarity-'+r+'">'+rarities[r]+'</span>'+tag('type').map(x=>'<span class="badge">Type : '+esc(x)+'</span>').join('')+tag('slot').map(x=>'<span class="badge">Emplacement : '+esc(x)+'</span>').join('')+tag('class').map(x=>'<span class="badge">Classe : '+esc(x)+'</span>').join('')+'</div>';
 let product='<div class="product"><h4>'+t('Product')+'</h4>'+facts+(a.desc?'<p class="effect">'+esc(a.desc)+'</p>':'')+'</div>';
 let ingredients=items.length?'<div><b>'+t('Ingredients')+'</b><ul class="ingredients">'+items.map(x=>{let m=x.match(/^(\d+)x\s+(.+)$/);return '<li><span class="qty">'+esc(m?m[1]:'1')+'&times;</span><span>'+esc(m?m[2]:x)+'</span></li>'}).join('')+'</ul></div>':'';
 let badges=(find?'<span class="badge status-find">'+t('Find')+'</span>':auto?'<span class="badge status-auto">'+t('Auto')+'</span>':'')+(sold?'<span class="badge status-info">'+t('Sold')+'</span>':'');
 return '<div class="recipe-meta">'+product+ingredients+(cost?'<div class="cost">Co&ucirc;t : '+esc(cost.replace(/^Cost:\s*/,'').replace(/\bgold\b/i,'or'))+'</div>':'')+'<div>'+badges+'</div></div>'

function iconTile(icon){let n=Number(icon);if(!Number.isInteger(n)||n<0)return '';let x=(n%32)*64,y=Math.floor(n/32)*64;return '<span class="item-icon" aria-label="Icône" style="background-image:url(\'assets/farever-atlas-icons.png\');background-position:-'+x+'px -'+y+'px;background-size:2048px auto"></span>'}
function cards(items,mode='item'){let q=$('#search').value.toLocaleLowerCase('fr');return list(items).filter(x=>title(x.kind||x.id||x).toLocaleLowerCase('fr').includes(q)).map(x=>{let id=x.kind||x.id||x,a=(mode==='recipe'?recipes:atlas).get(id)||atlas.get(id)||{},rr=Number.isInteger(x.rarity)&&x.rarity>=0?x.rarity:Number(a.rarity)||0,isEquipment=mode==='item'&&(x.class==='st.item.Weapon'||x.class==='st.item.Gear'||['weapons','trinkets','appearances'].includes(a.category)),cardClass=isEquipment&&rr>0?' rarity-card-'+Math.min(4,rr):'';return '<article class="card item'+cardClass+'">'+iconTile(a.icon)+'<h3>'+esc(title(id))+'</h3>'+(a.category==='recipes'?recipeInfo(a):'<p>'+esc(a.desc||a.acquire||'')+'</p>')+'<span class="badge">'+esc(a.category||x.class||'')+'</span>'+(x.count>1?'<span class="badge">&times; '+x.count+'</span>':'')+(x.level?'<span class="badge">Niveau '+x.level+'</span>':'')+(x.upgrade?'<span class="badge">Am\u00e9lioration +'+x.upgrade+'</span>':'')+(Number.isInteger(x.rarity)&&x.rarity>=0?'<span class="badge rarity-'+Math.min(4,x.rarity)+'">Raret\u00e9 '+x.rarity+'</span>':'')+(a.icon&&a.icon!=='-1'?'<span class="badge">Image n&deg; '+esc(a.icon)+'</span>':'')+'</article>'}).join('')||'<p class="empty">'+t('Empty')+'</p>'}
function recipeLevel(id,job){let a=recipes.get(id)||{},m=(a.acquire||'').match(new RegExp(job+' (?:level|lvl) \\(?([0-9]+)','i'));return m?Number(m[1]):0}
function professions(j){let available=list(j.jobs).filter(x=>list(x.learned).length);if(!available.length)return '<p class="empty">'+t('NoJob')+'</p>';if(!available.some(x=>x.job===jobTab))jobTab=available[0].job;let nav='<div class="tabs">'+available.map(x=>'<button class="job '+(x.job===jobTab?'active':'')+'" data-job="'+esc(x.job)+'">'+esc(title(x.job))+' <small>lvl '+x.level+'</small></button>').join('')+'</div>';let current=available.find(x=>x.job===jobTab),groups=new Map();for(let id of list(current.learned)){let lv=recipeLevel(id,current.job);if(!groups.has(lv))groups.set(lv,[]);groups.get(lv).push({kind:id})}let levels=[...groups].sort((a,b)=>a[0]-b[0]).map(([lv,it],i)=>'<details '+(i===0?'open':'')+'><summary>' + t('Level') + ' ' + (lv||'?') + ' &mdash; '+it.length+ ' ' + (it.length>1?t('Recipes'):t('Recipe'))+'</summary><div class="grid">'+cards(it,'recipe')+'</div></details>').join('');return nav+'<div class="levels">'+levels+'</div>'}

function render(){if(!D)return;let n=$('#hero').value,i=inv.get(n)||{},j=jobs.get(n)||{},cls=heroTheme(i,i.character||n),tabs=[t('Inv'),t('Bank'),t('Equip'),t('Jobs'),t('Runes'),t('Mastery'),t('Collection')];let counts={[t('Inv')]:list(i.bags).length,[t('Bank')]:[...list(i.bank),...list(i.bankEquipment)].length,[t('Equip')]:list(i.equipped).length,[t('Jobs')]:list(j.jobs).length,[t('Runes')]:list(j.runes).length,[t('Mastery')]:list(j.weaponMastery).length};$('#stats').hidden=true;$('#tabs').innerHTML=tabs.map(x=>'<button class="'+(x===tab?'active':'')+'" data-tab="'+x+'">'+x+' <small>'+((counts[x]??''))+'</small></button>').join('');$('#characters').querySelectorAll('[data-character]').forEach(b=>b.classList.toggle('active',b.dataset.character===n));$('#footer-read').textContent=t('LastRead') + ' : '+(D.generatedAt||'?');let body='';if(tab===t('Inv'))body='<div class="grid">'+cards(list(i.bags))+'</div>';if(tab===t('Equip'))body='<div class="grid">'+cards(list(i.equipped))+'</div>';if(tab===t('Bank'))body='<div class="grid">'+cards([...list(i.bank),...list(i.bankEquipment)])+'</div>';if(tab===t('Jobs'))body=professions(j);if(tab===t('Runes'))body='<div class="grid">'+cards(j.runes)+'</div>';if(tab===t('Mastery')){let mastery=[...list(j.weaponMastery)].sort((a,b)=>(Number(b.kills)||0)-(Number(a.kills)||0)),top=new Map(mastery.slice(0,4).map((x,n)=>[x.weapon,4-n]));body='<div class="grid">'+mastery.map(x=>{let a=atlas.get(x.weapon)||{},rank=top.get(x.weapon),border=rank?' rarity-card-'+rank:'';return '<article class="card item'+border+'">'+iconTile(a.icon)+'<h3>'+esc(title(x.weapon))+'</h3><span class="badge">'+esc(x.kills)+' ' + t('Kills') + '</span>'+(i.activeWeapon===x.weapon?'<span class="badge status-auto">'+t('ActiveWpn')+'</span>':'')+'</article>'}).join('')+'</div>'}if(tab===t('Collection'))body=Object.entries(list(D.collections).find(c=>c.steamAccountId===i.steamAccountId)||{}).filter(([,v])=>Array.isArray(v)).map(([k,v])=>'<h2>'+esc(k)+' ('+v.length+')</h2><
